name: Build, Test and Package

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (SFML 3)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ \
            libsfml-dev nlohmann-json3-dev libgtest-dev xvfb libgl1-mesa-dri zip

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTW_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Headless smoke test
        run: xvfb-run -a -s "-screen 0 1600x1000x24" timeout 30 ./build/thunder_wings --smoke-test --no-audio

      - name: Package
        run: |
          mkdir -p "Thunder_Wings_Linux"
          cp build/thunder_wings "Thunder_Wings_Linux/"
          cp -r assets "Thunder_Wings_Linux/"
          cp README.md LICENSE "Thunder_Wings_Linux/"
          zip -r Thunder_Wings_Linux.zip Thunder_Wings_Linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Thunder_Wings_Linux
          path: Thunder_Wings_Linux.zip

  windows:
    name: Windows (SFML 3)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download SFML 3.1.0
        shell: pwsh
        run: |
          $url = "https://github.com/SFML/SFML/releases/download/3.1.0/SFML-3.1.0-windows-vc17-64-bit.zip"
          Invoke-WebRequest -Uri $url -OutFile sfml.zip
          Expand-Archive -Path sfml.zip -DestinationPath . -Force
          Rename-Item -Path "SFML-3.1.0" -NewName "sfml"

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            -DSFML_DIR="$env:GITHUB_WORKSPACE/sfml/lib/cmake/SFML" `
            -DTW_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $release = "Thunder_Wings_Windows"
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          $exe = Get-ChildItem -Path build -Recurse -Filter thunder_wings.exe | Select-Object -First 1
          if (-not $exe) { throw "thunder_wings.exe was not produced" }
          Copy-Item $exe.FullName "$release/thunder_wings.exe"
          Copy-Item "sfml/bin/*.dll" "$release/"
          Copy-Item assets "$release/assets" -Recurse
          Copy-Item README.md, LICENSE "$release/"
          Compress-Archive -Path "$release/*" -DestinationPath "$release.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Thunder_Wings_Windows
          path: Thunder_Wings_Windows.zip

  sanitizers:
    name: Linux Debug (ASan/UBSan)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ \
            libsfml-dev nlohmann-json3-dev libgtest-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTW_BUILD_TESTS=ON \
            -DTW_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure
